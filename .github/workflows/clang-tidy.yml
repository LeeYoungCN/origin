# 跨平台静态检查（clang-tidy）。与构建流水线分开：
#   - 三平台并行，不拖慢构建/测试的关键路径；
#   - 失败时状态独立，便于单独设为 required check；
#   - 只跑一次（每个平台一份编译数据库），不需要跟着构建矩阵重复。
#
# 三平台差异只在“编译数据库”和“clang-tidy 安装方式”，检查规则完全共用
# .clang-tidy / script/check_tidy.sh。
name: clang-tidy

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    paths:
      - "src/**"
      - ".clang-tidy"
      - ".clangd"
      - "script/check_tidy.sh"
      - "script/load_msvc_env.sh"
      - "CMakePresets.json"
      - "cmake/toolchains/**"
      - ".github/workflows/clang-tidy.yml"
  workflow_dispatch:

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 是开发主环境，作为必须通过的检查。
          - os: windows-latest
            preset: win_clang_cl_debug
            configure-args: ""
          # Linux / macOS 先处于观察期：失败会在 PR 上显示为红叉（可见、可点开），
          # 但不要把它们加进分支保护（required status checks），因此不会阻塞合并。
          # 清完平台差异后，再把它们加进 required checks。
          - os: ubuntu-latest
            preset: linux_clang_debug
            configure-args: "-DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22"
          - os: macos-15
            preset: darwin_clang_debug
            configure-args: ""

    steps:
    - uses: actions/checkout@v4

    - name: module layer check
      working-directory: ${{ github.workspace }}
      shell: bash
      # 分层是硬约束：低层模块不允许 include 高层。不依赖编译数据库，先跑。
      run: bash ./script/check_layers.sh

    - name: Install LLVM 22 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco upgrade llvm --version=22.1.8 --allow-downgrade -y --no-progress
        $version = clang-tidy --version | Out-String
        Write-Output $version
        if ($version -notmatch 'LLVM version 22\.') {
          throw "Expected clang-tidy from LLVM 22, got: $version"
        }

    - name: Install LLVM 22 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 22
        sudo apt-get install -y clang-22 clang-tidy-22
        # apt.llvm.org 同时提供带版本的 /usr/bin 链接和 /usr/lib/llvm-22/bin，
        # 把后者放到 PATH 前面，脚本里的 clang-tidy / clangd 才会是 22。
        echo "/usr/lib/llvm-22/bin" >> "${GITHUB_PATH}"
        /usr/lib/llvm-22/bin/clang-tidy --version
        /usr/lib/llvm-22/bin/clangd --version

    - name: Install LLVM 22 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if brew info --formula llvm@22 >/dev/null 2>&1; then
          brew install llvm@22
          LLVM_PREFIX="$(brew --prefix llvm@22)"
        else
          # 没有版本化 formula 时退回最新版；版本不一致会在 check 名自检里暴露。
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
        fi
        echo "${LLVM_PREFIX}/bin" >> "${GITHUB_PATH}"
        "${LLVM_PREFIX}/bin/clang-tidy" --version

    - name: Configure CMake (compile database)
      working-directory: ${{ github.workspace }}
      shell: bash
      # Windows runner 默认 shell 是 pwsh，它会把 "-DVAR=x.y.z" 拆开；统一用 bash。
      run: cmake --preset=${{ matrix.preset }} ${{ matrix.configure-args }}

    - name: clangd config smoke check
      working-directory: ${{ github.workspace }}
      shell: bash
      # 先让脚本把 out/build/<preset>/compile_commands.json 复制到 out/build，
      # 确保 .clangd 与提交前脚本用的是同一份编译参数，再让 clangd 完整解析一次。
      run: |
        bash ./script/check_tidy.sh --prepare-db --no-configure --preset ${{ matrix.preset }}
        clangd --check=src/libs/common/src/version.cpp

    - name: clang-tidy check
      working-directory: ${{ github.workspace }}
      shell: bash
      # 不做 continue-on-error：失败必须体现为红叉，避免“绿色但没人看”的假象。
      # Linux/macOS 在清完平台差异前不加进分支保护的 required checks，所以只提示、不阻塞。
      run: bash ./script/check_tidy.sh --all --no-configure --preset ${{ matrix.preset }}
