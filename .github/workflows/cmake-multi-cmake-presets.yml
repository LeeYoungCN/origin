# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple CMakePresets.json

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        platform: [gnu, clang, msvc]
        include:
          # Windows 配置
          - os: windows-latest
            platform: msvc
            preset: win_clang_cl_release
            compiler: msvc
          - os: windows-latest
            platform: gnu
            preset: win_mingw_release
            compiler: mingw
          # Ubuntu 配置
          - os: ubuntu-latest
            platform: clang
            preset: linux_clang_release
            compiler: clang
          - os: ubuntu-latest
            platform: gnu
            preset: linux_gnu_release
            compiler: gcc
          # macOS 配置
          - os: macos-15
            platform: clang
            preset: darwin_clang_release
            compiler: clang
        exclude:
          - os: windows-latest
            platform: clang
          - os: ubuntu-latest
            platform: msvc
          - os: macos-15
            platform: msvc
          - os: macos-15
            platform: gnu

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/out/build" >> "$GITHUB_OUTPUT"
        echo "build-install-dir=${{ github.workspace }}/out/install" >> "$GITHUB_OUTPUT"
        echo "dist-dir=${{ github.workspace }}/dist" >> "$GITHUB_OUTPUT"
        # 打 tag（v1.2.3）时用 tag 号当版本，其余情况库内版本为 0.0.0；
        # 包名额外带短 sha，保证同一条流水线产出的包名总能区分来源。
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "pkg-version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          echo "pkg-version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        fi

    - name: Update MinGW via MSYS2 (Windows GCC only)
      if: matrix.os == 'windows-latest' && matrix.compiler == 'mingw'
      run: |
        # 1. 启动 MSYS2 终端并更新包数据库（仅更新必要的索引）
        C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm"
        
        # 2. 升级 MinGW 64位 GCC 工具链（包含 g++、标准库等）
        C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-x86_64-gcc"
        
        # 3. （可选）升级配套工具（如 make、gdb，按需添加）
        C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-x86_64-make mingw-w64-x86_64-gdb"
        
        # 4. 将 MinGW 路径添加到环境变量（确保优先使用）
        echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: cmake --preset=${{ matrix.preset }} -DORIGIN_VERSION=${{ steps.strings.outputs.version }}

    - name: Build And Install
      working-directory: ${{ github.workspace }}
      run: cmake --build --preset=${{ matrix.preset }}_build

    - name: Test
      working-directory: ${{ github.workspace }}
      run: ctest --preset=${{ matrix.preset }}_ctest

    # 打 tag（v1.0.0）时用 tag 号当版本，其余情况用 0.0.0-<短 sha>，
    # 保证同一条流水线产出的包名总能区分来源。
    - name: Package install tree
      id: package
      shell: bash
      run: |
        set -euo pipefail
        PKG="origin-${{ steps.strings.outputs.pkg-version }}-${{ matrix.preset }}"
        DIST="${{ steps.strings.outputs.dist-dir }}"
        mkdir -p "${DIST}"
        cd "${{ steps.strings.outputs.build-install-dir }}/${{ matrix.preset }}"
        # 归档写到上一级再移走，原因有两个：
        #   1) 若写在 "." 内部，tar 会报 "file changed as we read it"，Linux 上直接失败
        #   2) 用相对路径，避免 GNU tar 把 Windows 的 "D:\..." 盘符当成远程主机 host:path
        tar -czf "../${PKG}.tar.gz" .
        mv "../${PKG}.tar.gz" "${DIST}/"
        echo "package=${PKG}" >> "$GITHUB_OUTPUT"
        ls -lh "${DIST}"

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: origin-package-${{ matrix.preset }}
        path: ${{ steps.strings.outputs.dist-dir }}/*.tar.gz
        if-no-files-found: error
        retention-days: 7

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4  # 升级到v4版本
      with:
        name: ${{ matrix.preset }}-build
        path: ${{ steps.strings.outputs.build-install-dir }}
        # v4版本新增的可选配置（根据需要添加）
        if-no-files-found: warn  # 无文件时警告而非失败
        retention-days: 7  #  artifacts保留7天

  # 只有 push tag 时才发布；PR / 普通 push 只留 workflow artifact。
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        pattern: origin-package-*
        path: dist
        merge-multiple: true

    - name: Generate checksums
      working-directory: dist
      run: |
        sha256sum ./*.tar.gz > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.tar.gz
          dist/SHA256SUMS.txt
        generate_release_notes: true
        fail_on_unmatched_files: true
        # v1.0.0-rc1 这类带连字符的 tag 自动标为预发布
        prerelease: ${{ contains(github.ref_name, '-') }}
